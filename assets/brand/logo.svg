<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="90%">
      <stop offset="0%" stop-color="#FBF6EE"/>
      <stop offset="100%" stop-color="#F2E9DC"/>
    </radialGradient>
    <linearGradient id="doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2875F"/>
      <stop offset="100%" stop-color="#C95C33"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3A2A1C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- warm ivory surface -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- document (form) card -->
  <g filter="url(#shadow)">
    <rect x="118" y="96" width="276" height="320" rx="34" fill="url(#doc)"/>
    <!-- folded corner -->
    <path d="M118 96 h276 v0 l-74 74 h-134 a60 60 0 0 1 -60 60 z"
          fill="#A9481F" opacity="0.45"/>
    <path d="M394 96 v74 h-74 z" fill="#B8532A"/>
  </g>

  <!-- form lines -->
  <g fill="#FCE8DB" opacity="0.95">
    <rect x="156" y="200" width="200" height="22" rx="11"/>
    <rect x="156" y="244" width="150" height="22" rx="11" opacity="0.7"/>
    <rect x="156" y="288" width="178" height="22" rx="11" opacity="0.55"/>
    <rect x="156" y="332" width="120" height="22" rx="11" opacity="0.4"/>
  </g>

  <!-- vault lock slot + fingerprint (biometric + secure store) -->
  <circle cx="356" cy="140" r="52" fill="#F2E9DC"/>
  <circle cx="356" cy="140" r="52" fill="none" stroke="#C95C33" stroke-width="10"/>
  <g fill="none" stroke="#C95C33" stroke-width="7" stroke-linecap="round">
    <path d="M332 128 a36 36 0 0 1 34 -6"/>
    <path d="M326 150 a38 38 0 0 0 30 26"/>
    <path d="M376 124 a40 40 0 0 0 -12 -12"/>
    <path d="M332 118 a50 50 0 0 1 20 -8"/>
  </g>
  <circle cx="356" cy="146" r="5" fill="#C95C33"/>

  <!-- vault teeth under the lock -->
  <g fill="#C95C33">
    <rect x="322" y="196" width="16" height="22" rx="4"/>
    <rect x="348" y="202" width="16" height="16" rx="4"/>
    <rect x="374" y="196" width="16" height="22" rx="4"/>
  </g>
</svg>