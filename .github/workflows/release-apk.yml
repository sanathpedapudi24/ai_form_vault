name: Build & Release APK

# Every push to main gets its own build number, Git tag, and GitHub Release —
# no more manually cutting a "v*" tag for each release. Pushing a "v*" tag by
# hand still works too, for a deliberate/manual release.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Cancel a superseded run if commits land while a build is still in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Quality gate before anything gets tagged or released.
      - name: Analyze & test
        run: |
          flutter analyze
          flutter test

      # Auto-bump the build number (the "+N" in pubspec's version) on every
      # main push, then tag it, so each build has a unique, ever-increasing
      # version with no manual step. The semantic version (X.Y.Z) stays under
      # human control — bump it yourself in pubspec.yaml when it matters.
      - name: Bump build number and tag
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          current="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')"
          name="${current%+*}"
          build="${current#*+}"
          next_version="${name}+$((build + 1))"

          sed -i "s/^version:.*/version: ${next_version}/" pubspec.yaml

          git add pubspec.yaml
          git commit -m "chore: bump build to ${next_version} [skip ci]"
          git tag "v${next_version}"
          git push origin HEAD:main
          git push origin "v${next_version}"

          echo "tag=v${next_version}" >> "$GITHUB_OUTPUT"

      # A manually-pushed "v*" tag releases as-is, using its own name.
      - name: Resolve tag for a manual release
        if: startsWith(github.ref, 'refs/tags/')
        id: manual_tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ai-form-vault.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag || steps.manual_tag.outputs.tag }}
          files: build/app/outputs/flutter-apk/ai-form-vault.apk
          generate_release_notes: true
