name: CI / CD — Android APK Build & Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  ANDROID_COMPILE_SDK: 36
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: 27.0.12077973
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" -Dorg.gradle.daemon=false

jobs:
  # ===================================================================
  # 1) CI — Tests, Lint, Debug APK (every PR / push)
  # ===================================================================
  ci:
    name: CI — Tests, Lint, Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
        env:
          GRADLE_OPTS: ${{ env.GRADLE_OPTS }}

      - name: Run Android Lint (debug)
        run: ./gradlew lintDebug --no-daemon --stacktrace || true
        env:
          GRADLE_OPTS: ${{ env.GRADLE_OPTS }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: ${{ env.GRADLE_OPTS }}

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ===================================================================
  # 2) Release — Signed APK + GitHub Release (only on tags)
  # ===================================================================
  release:
    name: Release — Sign APK & Publish
    needs: ci
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 60
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}

    steps:
      - name: Check release signing configuration
        id: release_config
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        if: steps.release_config.outputs.configured == 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        if: steps.release_config.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        if: steps.release_config.outputs.configured == 'true'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2
        if: steps.release_config.outputs.configured == 'true'

      - name: Make gradlew executable
        run: chmod +x gradlew
        if: steps.release_config.outputs.configured == 'true'

      - name: Decode release keystore
        id: decode_keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release-keystore.jks
          echo "keystore_path=$PWD/release-keystore.jks" >> $GITHUB_OUTPUT
        if: steps.release_config.outputs.configured == 'true'

      - name: Run unit tests (release)
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace
        if: steps.release_config.outputs.configured == 'true'
        env:
          RELEASE_STORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GRADLE_OPTS: ${{ env.GRADLE_OPTS }}

      - name: Run Android Lint (release)
        run: ./gradlew lintRelease --no-daemon --stacktrace || true
        if: steps.release_config.outputs.configured == 'true'
        env:
          RELEASE_STORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GRADLE_OPTS: ${{ env.GRADLE_OPTS }}

      - name: Build signed Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        if: steps.release_config.outputs.configured == 'true'
        env:
          RELEASE_STORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GRADLE_OPTS: ${{ env.GRADLE_OPTS }}

      - name: Verify APK is signed
        run: |
          apk_path=$(find app/build/outputs/apk/release -name "app-release.apk" | head -1)
          if [ -z "$apk_path" ]; then
            echo "❌ No release APK found"
            exit 1
          fi
          echo "APK: $apk_path"
          "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --print-certs "$apk_path" || true
        if: steps.release_config.outputs.configured == 'true'

      - name: Extract version from tag
        id: version
        run: |
          tag=${GITHUB_REF#refs/tags/}
          echo "tag=$tag" >> $GITHUB_OUTPUT
          version_name=${tag#v}
          echo "version_name=$version_name" >> $GITHUB_OUTPUT
        if: steps.release_config.outputs.configured == 'true'

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: steps.release_config.outputs.configured == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## AI Form & Vault ${{ steps.version.outputs.tag }}

            Signed release APK built from tag `${{ steps.version.outputs.tag }}`.

            ### What's included
            - Signed release APK (`app-release.apk`)
            - Built with GitHub Actions CI/CD

            ### Installation
            1. Download `app-release.apk` from this release.
            2. On your Android device, enable "Install from unknown sources".
            3. Open the APK and install.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK artifact (backup)
        uses: actions/upload-artifact@v4
        if: steps.release_config.outputs.configured == 'true'
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  # ===================================================================
  # 3) Release fallback — notify if no keystore configured
  # ===================================================================
  release-no-keystore:
    name: Release — No Keystore (skip)
    needs: ci
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 5

    steps:
      - name: Warn about missing keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            echo "Release signing secret is configured; signed release job handles this tag."
          else
            echo "RELEASE_KEYSTORE_B64 secret is not configured."
            echo "Release APK will not be built or published."
            echo "Add the secret to enable signed releases on tags."
          fi
