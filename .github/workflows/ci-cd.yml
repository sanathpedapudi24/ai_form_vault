name: CI / CD — Android APK Build & Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Least privilege by default. The release job opts into contents: write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  # ===================================================================
  # 1) CI — Tests, Lint, Debug APK (every push / PR / tag)
  # ===================================================================
  build:
    name: CI — Tests, Lint, Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform and build-tools
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" 2>&1 | tail -n 20

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # Lint is advisory: the report is uploaded below, but lint findings must not
      # block shipping an APK. Remove continue-on-error to make it a hard gate.
      - name: Run Android Lint
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  # ===================================================================
  # 2) Release — Signed APK + GitHub Release (only on v* tags)
  #    Builds/testing already happened in `build`; this job only signs
  #    and publishes. Steps are skipped when signing secrets are absent.
  # ===================================================================
  release:
    name: Release — Signed APK & Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Warn when signing secrets are missing
        if: env.RELEASE_KEYSTORE_B64 == ''
        run: |
          echo "::warning title=Signed release skipped::RELEASE_KEYSTORE_B64 is not configured, so no signed APK was published for this tag. Add the four RELEASE_* secrets to enable signed releases."

      - name: Checkout repository
        if: env.RELEASE_KEYSTORE_B64 != ''
        uses: actions/checkout@v7

      - name: Set up JDK 17
        if: env.RELEASE_KEYSTORE_B64 != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        if: env.RELEASE_KEYSTORE_B64 != ''
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform and build-tools
        if: env.RELEASE_KEYSTORE_B64 != ''
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" 2>&1 | tail -n 20

      - name: Make gradlew executable
        if: env.RELEASE_KEYSTORE_B64 != ''
        run: chmod +x gradlew

      - name: Decode and verify release keystore
        if: env.RELEASE_KEYSTORE_B64 != ''
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/release-keystore.jks"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$RELEASE_STORE_PASSWORD" > /dev/null
          echo "RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Derive version from tag
        if: env.RELEASE_KEYSTORE_B64 != ''
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: env.RELEASE_KEYSTORE_B64 != ''
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signature and stage release asset
        if: env.RELEASE_KEYSTORE_B64 != ''
        id: asset
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error title=Build output missing::No release APK at $APK"
            exit 1
          fi
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          ASSET="ai-form-vault-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$ASSET"
          echo "path=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: env.RELEASE_KEYSTORE_B64 != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AI Form & Vault ${{ steps.version.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: ${{ steps.asset.outputs.path }}
          body: |
            ## AI Form & Vault ${{ steps.version.outputs.tag }}

            Signed release APK, built and tested by GitHub Actions.

            ### Install
            1. Download `${{ steps.asset.outputs.path }}`.
            2. Allow installs from unknown sources on your device.
            3. Open the APK to install (min Android 8.0 / API 26).
