# Project-wide Gradle settings.

# JVM args for Gradle daemon (increase heap for large Android builds)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m

# Parallel execution and caching
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# --- Release signing ---
# Signing is configured from ENVIRONMENT VARIABLES, never from this file:
#   RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# If they are absent, release builds are produced unsigned and debug builds are unaffected.
