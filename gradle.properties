# Project-wide Gradle settings.

# JVM args for Gradle daemon (increase heap for large Android builds)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m

# Parallel execution and caching
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# --- Release signing (values injected via CI secrets or local env) ---
# Do NOT commit real passwords here. Use environment variables instead:
#   RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
RELEASE_STORE_FILE=release-keystore.jks
RELEASE_STORE_PASSWORD=
RELEASE_KEY_ALIAS=
RELEASE_KEY_PASSWORD=
